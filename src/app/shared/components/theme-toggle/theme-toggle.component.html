<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-label]="
    currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
  "
  [attr.aria-pressed]="currentTheme() === 'dark'"
>
  <svg viewBox="0 0 100 100" class="theme-toggle__icon">
    <defs>
      <linearGradient id="sun-gradient" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#ff7a18" />
        <stop offset="100%" stop-color="#ffd200" />
      </linearGradient>

      <linearGradient id="moon-gradient" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#5eaa2f" />
        <stop offset="100%" stop-color="#95c5ef" />
      </linearGradient>
    </defs>

    <circle cx="50" cy="50" r="40" class="sun" />

    <circle cx="50" cy="50" r="40" class="moon" />

    <circle
      cx="65"
      cy="35"
      r="40"
      class="mask"
      [class.is-dark]="currentTheme() === 'dark'"
    />
  </svg>
</button>
