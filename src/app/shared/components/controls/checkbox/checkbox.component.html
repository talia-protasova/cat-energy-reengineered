<div class="checkbox">
  <input
    class="checkbox__input visually-hidden"
    type="checkbox"
    [id]="id()"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onToggle($event)"
    (blur)="blurred.emit()"
  />
  <label class="checkbox__label" [for]="id()">
    {{ label() }}
  </label>
</div>
