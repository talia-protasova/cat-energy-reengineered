<div class="input-field">
  <label class="input-field__label" [for]="id()">
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true">*</span>
    }
  </label>

  <input
    class="input-field__input"
    [class.input-field__input--error]="hasError()"
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value() ?? ''"
    [disabled]="disabled"
    [autocomplete]="autocomplete()"
    [attr.inputmode]="inputmode() || null"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="errorId() || null"
    [mask]="mask()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />

  @if (iconHref()) {
    <svg
      class="input-field__icon"
      [attr.viewBox]="iconViewBox()"
      [attr.width]="iconWidth()"
      [attr.height]="iconHeight()"
      aria-hidden="true"
      focusable="false"
    >
      <use [attr.href]="iconHref()"></use>
    </svg>
  }

  <p
    class="input-field__error"
    [id]="errorId()"
    [attr.aria-hidden]="!hasError() || null"
  >
    @if (hasError() && errorText()) {
      {{ errorText() }}
    }
  </p>
</div>
