<section class="add-more wrapper" aria-labelledby="add-more-title">
  <h2 id="add-more-title" class="add-more__heading">Additional products</h2>

  <div class="add-more__layout">
    <ul class="add-more__list">
      <li class="add-more__item">
        <article class="add-more-card">
          <h3 class="add-more-card__title">Sugar substitute</h3>

          <p class="add-more-card__meta">
            <span class="add-more-card__amount"> 1 pack (100 g) </span>

            <span class="add-more-card__price"> $2 </span>
          </p>

          <button
            type="button"
            class="add-more-card__button button button--primary button--md"
            aria-label="Order sugar substitute"
          >
            Order
          </button>
        </article>
      </li>

      <li class="add-more__item">
        <article class="add-more-card">
          <h3 class="add-more-card__title">Drinking water</h3>

          <p class="add-more-card__meta">
            <span class="add-more-card__amount"> 5 liters </span>

            <span class="add-more-card__price"> $0.5 </span>
          </p>

          <button
            type="button"
            class="add-more-card__button button button--primary button--md"
            aria-label="Order drinking water"
          >
            Order
          </button>
        </article>
      </li>

      <li class="add-more__item">
        <article class="add-more-card">
          <h3 class="add-more-card__title">Milk</h3>

          <p class="add-more-card__meta">
            <span class="add-more-card__amount"> 1 liter </span>

            <span class="add-more-card__price"> $1 </span>
          </p>

          <button
            type="button"
            class="add-more-card__button button button--primary button--md"
            aria-label="Order milk"
          >
            Order
          </button>
        </article>
      </li>

      <li class="add-more__item">
        <article class="add-more-card">
          <h3 class="add-more-card__title">Vitamins</h3>

          <p class="add-more-card__meta">
            <span class="add-more-card__amount"> 1 pack (30 g) </span>

            <span class="add-more-card__price"> $3 </span>
          </p>

          <button
            type="button"
            class="add-more-card__button button button--primary button--md"
            aria-label="Order vitamins"
          >
            Order
          </button>
        </article>
      </li>
    </ul>

    <app-bonus-banner></app-bonus-banner>
  </div>
</section>
